# Render Blueprint: New -> Blueprint -> pick this repo. Or create a Web Service manually:
# runtime Docker, root directory "backend", Dockerfile path "backend/Dockerfile".
services:
  - type: web
    name: ine-price-tracker-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPE_INTERVAL_HOURS
        value: 2
      - key: SCRAPE_MAX_ATTEMPTS
        value: 3
      - key: SCRAPE_ATTEMPT_TIMEOUT_MS
        value: 45000
      - key: HEADLESS
        value: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
