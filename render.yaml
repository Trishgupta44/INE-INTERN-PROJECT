# Render Blueprint: New -> Blueprint -> pick this repo. Or create a Web Service manually with the same values.
services:
  - type: web
    name: ine-price-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx playwright install --with-deps chromium
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/ms-playwright
      - key: STORE_BASE_URL
        value: https://demo.inelabteamdev.com
      - key: SCRAPE_INTERVAL_HOURS
        value: 2
      - key: SCRAPE_MAX_ATTEMPTS
        value: 3
      - key: SCRAPE_ATTEMPT_TIMEOUT_MS
        value: 45000
      - key: HEADLESS
        value: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
